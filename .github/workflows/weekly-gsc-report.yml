name: Weekly GSC report

# Fires every Monday at 07:00 UTC (09:00 local CET). Pulls Google Search
# Console data and opens an Issue with the weekly SEO digest. GitHub emails
# the assignee when an issue is opened.
#
# Requires the repo secrets GSC_OAUTH_CLIENT_ID, GSC_OAUTH_CLIENT_SECRET
# and GSC_OAUTH_REFRESH_TOKEN — see docs/seo/gsc-report-setup.md.
# workflow_dispatch is enabled so you can test without waiting for Monday
# (Actions tab -> "Weekly GSC report" -> "Run workflow").

on:
  schedule:
    # Cron is in UTC. 07:00 UTC = 09:00 CET (winter) / 09:00 CEST (summer).
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Generate GSC report
        env:
          GSC_OAUTH_CLIENT_ID: ${{ secrets.GSC_OAUTH_CLIENT_ID }}
          GSC_OAUTH_CLIENT_SECRET: ${{ secrets.GSC_OAUTH_CLIENT_SECRET }}
          GSC_OAUTH_REFRESH_TOKEN: ${{ secrets.GSC_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/gsc-report.mjs > gsc-report.md
          echo "Report generated ($(wc -l < gsc-report.md) lines)."

      - name: Open report issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('gsc-report.md', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `SEO weekly — week of ${today}`,
              body,
              assignees: ['marijanpojatina2-netizen'],
              labels: ['seo-report'],
            });
