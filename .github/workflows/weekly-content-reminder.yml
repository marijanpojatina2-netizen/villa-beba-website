name: Weekly content sprint reminder

# Fires every Friday at 09:00 UTC (11:00 local CET) for 10 weeks starting
# 2026-05-08, opening a fresh Issue with the next topic from the queue.
# GitHub auto-emails the assignee when an issue is opened, so you get a
# reminder without us having to wire up SMTP/Resend separately.
#
# To stop early: edit END_DATE below to a date in the past, or just close
# the workflow file. To extend: bump END_DATE and add topics to the array
# in the "Resolve topic" step.

on:
  schedule:
    # Cron is in UTC. 09:00 UTC = 11:00 CET (winter) / 11:00 CEST (summer).
    - cron: '0 9 * * 5'
  workflow_dispatch:
    # Manual trigger so you can verify the workflow works without waiting
    # for Friday. Run from Actions tab → "Weekly content sprint reminder"
    # → "Run workflow".

permissions:
  issues: write

jobs:
  open-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current week and topic
        id: meta
        run: |
          set -euo pipefail

          START_DATE="2026-05-08"   # Week 1 fires on this Friday
          END_DATE="2026-07-12"     # Stop after this date (1-day buffer past week 10)

          TODAY=$(date -u +%Y-%m-%d)

          # Manual triggers (workflow_dispatch) bypass the date window so we
          # can test or shift the cadence without editing this file. Cron
          # triggers respect the window — if the schedule fires outside
          # [START_DATE, END_DATE] (e.g. after the 10-week sprint ends or
          # if it somehow runs early), the job exits cleanly without
          # opening an issue.
          IS_MANUAL="${{ github.event_name == 'workflow_dispatch' }}"

          if [[ "$IS_MANUAL" == "false" ]]; then
            if [[ "$TODAY" > "$END_DATE" ]]; then
              echo "Past end date $END_DATE — skipping" >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$TODAY" < "$START_DATE" ]]; then
              echo "Before start date $START_DATE — skipping" >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Compute week number. For manual runs before START_DATE (e.g.
          # initial smoke test), clamp to week 1 so we always pick a valid
          # topic from the queue.
          DIFF_DAYS=$(( ( $(date -u -d "$TODAY" +%s) - $(date -u -d "$START_DATE" +%s) ) / 86400 ))
          if [[ "$DIFF_DAYS" -lt 0 ]]; then
            WEEK=1
          else
            WEEK=$(( DIFF_DAYS / 7 + 1 ))
          fi

          # Topic queue, ordered by SEO leverage. Edit freely between runs —
          # week N reads index N-1 from this list.
          TOPICS=(
            "Truffle hunting near Svetvinčenat"
            "Restaurants in central Istria"
            "Beaches near Svetvinčenat"
            "Olive oil tasting from the villa"
            "Wedding vendors in Istria"
            "Family activities in central Istria"
            "Best time to visit Istria — month by month"
            "Renting a car for Istria"
            "Hiking and cycling routes near the villa"
            "Photography spots — golden hour locations"
          )

          if [[ "$WEEK" -lt 1 || "$WEEK" -gt "${#TOPICS[@]}" ]]; then
            echo "Week $WEEK out of range (1-${#TOPICS[@]}) — skipping" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOPIC="${TOPICS[$((WEEK - 1))]}"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
          echo "Resolved week $WEEK: $TOPIC"

      - name: Open content-sprint issue
        if: steps.meta.outputs.skip == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const week = '${{ steps.meta.outputs.week }}';
            const topic = `${{ steps.meta.outputs.topic }}`;
            const body = [
              `**This week's topic:** ${topic}`,
              '',
              'Drop this topic into Claude Code in the villa-beba repo to start the draft. Claude writes the EN+DE entry into `src/lib/guides.ts`, **asks you for 2 photos**, SEO-optimizes them (WebP conversion, descriptive filenames, EN+DE ALT text, Article schema wiring), and ships everything end-of-week.',
              '',
              '### Checklist',
              '',
              `- [ ] Open Claude Code → "Drafta novi guide o teme: ${topic}"`,
              '- [ ] Review draft for first-hand details (specific vendor names, prices, personal anecdotes)',
              '- [ ] **Send Claude 2 photos** for the guide (any format / resolution — Claude SEO-optimizes: PNG→WebP, descriptive filenames, EN+DE ALT text, schema integration)',
              '- [ ] Push commit (Claude handles — auto-promotes to production on `v7-light` within ~60-90s)',
              '- [ ] Verify both locale URLs return 200 on `ballenaandbeluga.com`',
              '- [ ] Run IndexNow: GitHub Actions tab → "IndexNow ping" → "Run workflow" → paste the two new URLs',
              '- [ ] Post to GBP — run `npm run gbp-draft`, paste the output on BOTH Villa Ballena and Villa Beluga listings (skip until postcard verification completes)',
              '',
              '### For Claude (paste this issue into Claude Code)',
              '',
              'When you start this task: draft the guide first, **then ask the user for 2 photos** before committing. Optimize them with the `hero` + `inlineImage` pattern from `src/lib/guides.ts` — see `truffle-hunting-near-svetvincenat` for the reference implementation. Wire the hero into Article JSON-LD via the existing `image` field in `getArticleSchema`. After the guide ships and 200-verifies, remind the user to run `npm run gbp-draft` for the Google Business Profile post (helper outputs copy-paste-ready text + hero URL + CTA for both villa listings).',
              '',
              '### Reference',
              '',
              '- Content plan: `~/.claude/plans/indexed-yawning-codd.md`',
              '- Existing guides: `src/lib/guides.ts`',
              '- Image pipeline reference: `truffle-hunting-near-svetvincenat` guide (hero + inlineImage, WebP @ 1920px / q82)',
              '- IndexNow docs: `docs/seo/indexnow-setup.md`',
              '',
              `*Week ${week} of 10. Auto-generated reminder — close this issue when the guide ships.*`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Content sprint week ${week}: ${topic}`,
              body,
              assignees: ['marijanpojatina2-netizen'],
              labels: ['content-sprint'],
            });
